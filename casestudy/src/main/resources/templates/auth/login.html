<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MiniBlog</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #f8fff8 0%, #e8f5e8 25%, #d4f1d4 50%, #c1edc1 75%, #b8e6b8 100%);
            background-size: 400% 400%;
            animation: modernGradient 20s ease infinite;
            display: flex; align-items: center; justify-content: center;
            color: #2d5016;
        }
        @keyframes modernGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .card {
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(34,139,34,0.2);
            padding: 3rem;
            width: 100%; max-width: 420px;
            box-shadow: 0 8px 32px rgba(34,139,34,0.12);
            position: relative; overflow: hidden;
        }
        .card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, #228b22 0%, #32cd32 100%);
        }
        .icon {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, #228b22 0%, #32cd32 100%);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.5rem; font-size: 1.5rem; color: white;
        }
        h1 {
            font-size: 2rem; font-weight: 700; text-align: center;
            background: linear-gradient(135deg, #228b22 0%, #32cd32 100%);
            background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        .subtitle { text-align: center; color: #4a6741; margin-bottom: 2rem; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.4rem; font-weight: 600; color: #2d5016; font-size: 0.9rem; }
        input {
            width: 100%; padding: 12px 16px;
            border: 2px solid rgba(34,139,34,0.2); border-radius: 12px;
            font-size: 1rem; background: rgba(255,255,255,0.8);
            transition: all 0.3s ease; color: #2d5016; font-family: inherit;
        }
        input:focus { outline: none; border-color: #228b22; background: rgba(255,255,255,0.95); box-shadow: 0 0 0 3px rgba(34,139,34,0.1); }
        .btn {
            width: 100%; padding: 13px; border: none; border-radius: 12px; font-size: 1rem;
            font-weight: 600; cursor: pointer; font-family: inherit;
            background: linear-gradient(135deg, #228b22 0%, #32cd32 100%);
            color: white; box-shadow: 0 4px 15px rgba(34,139,34,0.3);
            transition: all 0.3s ease; margin-top: 0.5rem;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(34,139,34,0.4); }
        .alert {
            padding: 0.8rem 1rem; border-radius: 10px; margin-bottom: 1.5rem;
            border: 1px solid; font-size: 0.9rem; display: flex; align-items: center; gap: 0.5rem;
        }
        .alert-error { background: rgba(220,53,69,0.1); border-color: rgba(220,53,69,0.3); color: #721c24; }
        .alert-success { background: rgba(34,139,34,0.1); border-color: rgba(34,139,34,0.3); color: #1e4620; }
        .footer { text-align: center; margin-top: 1.5rem; color: #4a6741; font-size: 0.9rem; }
        .footer a { color: #228b22; text-decoration: none; font-weight: 600; }
        .footer a:hover { text-decoration: underline; }
        .logo { text-align: center; margin-bottom: 1.5rem; }
        .logo a { font-size: 1.3rem; font-weight: 700; color: #228b22; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo"><a href="/posts"><i class="fas fa-code"></i> MiniBlog</a></div>
        <div class="icon"><i class="fas fa-sign-in-alt"></i></div>
        <h1>Welcome Back</h1>
        <p class="subtitle">Sign in to your account</p>

        <div th:if="${param.error}" class="alert alert-error">
            <i class="fas fa-exclamation-circle"></i> Invalid username or password.
        </div>
        <div th:if="${successMessage}" class="alert alert-success">
            <i class="fas fa-check-circle"></i> <span th:text="${successMessage}"></span>
        </div>

        <form th:action="@{/auth/login}" method="post">
            <div class="form-group">
                <label for="username"><i class="fas fa-user"></i> Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn"><i class="fas fa-sign-in-alt"></i> Sign In</button>
        </form>

        <div class="footer">
            Don't have an account? <a href="/auth/register">Register here</a>
        </div>
    </div>
</body>
</html>
