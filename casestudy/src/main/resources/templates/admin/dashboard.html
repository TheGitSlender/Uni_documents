<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - MiniBlog</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #f8fff8 0%, #e8f5e8 25%, #d4f1d4 50%, #c1edc1 75%, #b8e6b8 100%);
            color: #2d5016; line-height: 1.6;
        }
        .navbar {
            background: rgba(255,255,255,0.95); backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(34,139,34,0.2); padding: 1rem 0;
            position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 10px rgba(34,139,34,0.1);
        }
        .nav-container {
            max-width: 1200px; margin: 0 auto;
            display: flex; justify-content: space-between; align-items: center; padding: 0 2rem;
        }
        .logo { font-size: 1.5rem; font-weight: 700; color: #228b22; text-decoration: none; display: flex; align-items: center; gap: 0.5rem; }
        .nav-links { display: flex; gap: 2rem; align-items: center; }
        .nav-link { color: #4a6741; text-decoration: none; font-weight: 500; transition: color 0.3s ease; }
        .nav-link:hover { color: #228b22; }
        .nav-logout { background: none; border: none; color: #4a6741; font-weight: 500; cursor: pointer; font-family: inherit; font-size: 1rem; transition: color 0.3s ease; }
        .nav-logout:hover { color: #dc3545; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        .header { text-align: center; margin: 2rem 0 3rem 0; }
        .header h1 {
            font-size: 2.5rem; font-weight: 700;
            background: linear-gradient(135deg, #228b22 0%, #32cd32 100%);
            background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem; letter-spacing: -1px;
        }
        .header p { color: #4a6741; font-size: 1.1rem; }
        .section { margin-bottom: 3rem; }
        .section-title { font-size: 1.4rem; font-weight: 600; color: #228b22; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; }
        .card {
            background: rgba(255,255,255,0.9); backdrop-filter: blur(20px);
            border-radius: 16px; border: 1px solid rgba(34,139,34,0.2);
            margin-bottom: 1.5rem; overflow: hidden;
            box-shadow: 0 4px 15px rgba(34,139,34,0.08);
        }
        .card-header {
            padding: 1rem 1.5rem; background: rgba(34,139,34,0.06);
            border-bottom: 1px solid rgba(34,139,34,0.15);
            display: flex; justify-content: space-between; align-items: center;
        }
        .card-header .post-info { font-weight: 600; color: #2d5016; }
        .card-header .post-meta { font-size: 0.85rem; color: #4a6741; }
        .card-body { padding: 1rem 1.5rem; }
        .post-preview { color: #2d5016; font-size: 0.95rem; line-height: 1.6; margin-bottom: 0.75rem; }
        .comment-row {
            display: flex; justify-content: space-between; align-items: flex-start;
            padding: 0.75rem 0; border-bottom: 1px solid rgba(34,139,34,0.1);
            gap: 1rem;
        }
        .comment-row:last-child { border-bottom: none; }
        .comment-text { color: #2d5016; font-size: 0.9rem; flex: 1; }
        .comment-author { font-size: 0.8rem; color: #4a6741; margin-top: 0.25rem; }
        .btn {
            display: inline-flex; align-items: center; gap: 0.4rem;
            padding: 6px 14px; border-radius: 8px; text-decoration: none;
            font-weight: 600; transition: all 0.3s ease;
            border: none; cursor: pointer; font-size: 0.85rem; font-family: inherit;
        }
        .btn-danger { background: linear-gradient(135deg, #dc3545 0%, #e85d75 100%); color: white; box-shadow: 0 2px 8px rgba(220,53,69,0.3); }
        .btn-danger:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(220,53,69,0.4); }
        .no-comments { color: #4a6741; font-size: 0.9rem; font-style: italic; padding: 0.5rem 0; }
        .alert { padding: 1rem; border-radius: 12px; margin-bottom: 1.5rem; border: 1px solid; display: flex; align-items: center; gap: 0.5rem; }
        .alert-success { background: rgba(34,139,34,0.1); border-color: rgba(34,139,34,0.3); color: #1e4620; }
        .alert-error { background: rgba(220,53,69,0.1); border-color: rgba(220,53,69,0.3); color: #721c24; }
        @media (max-width: 768px) {
            .container { padding: 1rem; }
            .header h1 { font-size: 1.8rem; }
            .nav-container { padding: 0 1rem; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/posts" class="logo"><i class="fas fa-leaf"></i> MiniBlog</a>
            <div class="nav-links">
                <a href="/posts" class="nav-link">Posts</a>
                <a href="/users" class="nav-link">Users</a>
                <a href="/admin" class="nav-link">Admin</a>
                <form th:action="@{/auth/logout}" method="post" style="margin: 0;">
                    <button type="submit" class="nav-logout"><i class="fas fa-sign-out-alt"></i> Logout</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="header">
            <h1><i class="fas fa-shield-alt" style="font-size:2rem; -webkit-text-fill-color:#228b22;"></i> Admin Dashboard</h1>
            <p>Manage all posts and comments</p>
        </div>

        <div th:if="${successMessage}" class="alert alert-success">
            <i class="fas fa-check-circle"></i> <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-error">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${errorMessage}"></span>
        </div>

        <div class="section">
            <div class="section-title"><i class="fas fa-newspaper"></i> All Posts (<span th:text="${#lists.size(posts)}">0</span>)</div>

            <div th:if="${#lists.isEmpty(posts)}" style="color:#4a6741; padding: 1rem;">No posts yet.</div>

            <div th:each="post : ${posts}" class="card">
                <div class="card-header">
                    <div>
                        <div class="post-info">
                            <i class="fas fa-user"></i> <span th:text="${post.authorName}">Author</span>
                            <span th:if="${post.url != null}" style="margin-left:0.5rem; color:#228b22; font-size:0.8rem;"><i class="fas fa-video"></i> Video</span>
                            <span th:if="${post.content != null}" style="margin-left:0.5rem; color:#228b22; font-size:0.8rem;"><i class="fas fa-file-alt"></i> Article</span>
                        </div>
                        <div class="post-meta">
                            <span th:each="tag : ${post.tags}">#<span th:text="${tag.name}"></span> </span>
                        </div>
                    </div>
                    <form th:action="@{/admin/posts/{id}/delete(id=${post.id})}" method="post"
                          onsubmit="return confirm('Delete this post and all its comments?')">
                        <button type="submit" class="btn btn-danger"><i class="fas fa-trash"></i> Delete Post</button>
                    </form>
                </div>
                <div class="card-body">
                    <div class="post-preview" th:text="${#strings.abbreviate(post.preview, 200)}">Content</div>

                    <div th:if="${not #lists.isEmpty(post.comments)}">
                        <div style="font-size:0.9rem; font-weight:600; color:#228b22; margin-bottom:0.5rem;">
                            <i class="fas fa-comments"></i> Comments (<span th:text="${#lists.size(post.comments)}">0</span>)
                        </div>
                        <div th:each="comment : ${post.comments}" class="comment-row">
                            <div>
                                <div class="comment-text" th:text="${comment.content}">Comment text</div>
                                <div class="comment-author">
                                    <i class="fas fa-user"></i> <span th:text="${comment.authorName}"></span>
                                </div>
                            </div>
                            <form th:action="@{/admin/posts/{postId}/comments/{id}/delete(postId=${post.id},id=${comment.id})}"
                                  method="post" style="flex-shrink:0;"
                                  onsubmit="return confirm('Delete this comment?')">
                                <button type="submit" class="btn btn-danger"><i class="fas fa-trash"></i></button>
                            </form>
                        </div>
                    </div>
                    <div th:if="${#lists.isEmpty(post.comments)}" class="no-comments">No comments on this post.</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
