<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniBlog - Users</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #f8fff8 0%, #e8f5e8 25%, #d4f1d4 50%, #c1edc1 75%, #b8e6b8 100%);
            color: #2d5016; line-height: 1.6;
        }
        .navbar {
            background: rgba(255,255,255,0.95); backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(34,139,34,0.2); padding: 1rem 0;
            position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 10px rgba(34,139,34,0.1);
        }
        .nav-container {
            max-width: 1200px; margin: 0 auto;
            display: flex; justify-content: space-between; align-items: center; padding: 0 2rem;
        }
        .logo { font-size: 1.5rem; font-weight: 700; color: #228b22; text-decoration: none; display: flex; align-items: center; gap: 0.5rem; }
        .nav-links { display: flex; gap: 2rem; align-items: center; }
        .nav-link { color: #4a6741; text-decoration: none; font-weight: 500; transition: color 0.3s ease; }
        .nav-link:hover { color: #228b22; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        .header { text-align: center; margin: 2rem 0 3rem 0; }
        .header h1 {
            font-size: 3rem; font-weight: 700;
            background: linear-gradient(135deg, #228b22 0%, #32cd32 100%);
            background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 1rem; letter-spacing: -1px;
        }
        .header p { color: #4a6741; font-size: 1.2rem; max-width: 600px; margin: 0 auto; }
        .actions { display: flex; justify-content: flex-end; margin-bottom: 2rem; }
        .btn {
            display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 12px 24px; border-radius: 12px; text-decoration: none;
            font-weight: 600; transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
            border: none; cursor: pointer; font-size: 0.95rem;
        }
        .btn-primary { background: linear-gradient(135deg, #228b22 0%, #32cd32 100%); color: white; box-shadow: 0 4px 15px rgba(34,139,34,0.3); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(34,139,34,0.4); }
        .btn-secondary { background: rgba(255,255,255,0.7); color: #2d5016; border: 1px solid rgba(34,139,34,0.3); }
        .btn-secondary:hover { background: rgba(34,139,34,0.1); border-color: rgba(34,139,34,0.5); transform: translateY(-2px); }
        .btn-danger { background: linear-gradient(135deg, #dc3545 0%, #e85d75 100%); color: white; box-shadow: 0 4px 15px rgba(220,53,69,0.3); }
        .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(220,53,69,0.4); }
        .users-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 2rem; margin-top: 2rem; }
        .user-card {
            background: rgba(255,255,255,0.9); backdrop-filter: blur(20px);
            border-radius: 20px; border: 1px solid rgba(34,139,34,0.2); overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4,0,0.2,1); position: relative;
            box-shadow: 0 4px 15px rgba(34,139,34,0.1);
        }
        .user-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, #228b22 0%, #32cd32 100%); opacity: 0; transition: opacity 0.3s ease;
        }
        .user-card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(34,139,34,0.15); border-color: rgba(34,139,34,0.4); }
        .user-card:hover::before { opacity: 1; }
        .user-content { padding: 2rem; }
        .user-icon {
            width: 60px; height: 60px; background: linear-gradient(135deg, #228b22 0%, #32cd32 100%);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.5rem; font-size: 1.5rem; color: white;
        }
        .user-name { font-size: 1.4rem; font-weight: 600; color: #2d5016; margin-bottom: 0.5rem; text-align: center; }
        .user-email { color: #4a6741; font-size: 0.95rem; margin-bottom: 1.5rem; text-align: center; }
        .user-stats { display: flex; justify-content: center; gap: 1rem; margin-bottom: 1.5rem; }
        .stat-item { text-align: center; }
        .stat-number { display: block; font-size: 1.2rem; font-weight: 600; color: #228b22; }
        .stat-label { font-size: 0.8rem; color: #4a6741; text-transform: uppercase; letter-spacing: 0.5px; }
        .user-actions { display: flex; gap: 0.5rem; justify-content: center; }
        .btn-small { padding: 8px 16px; font-size: 0.85rem; }
        .empty-state {
            text-align: center; padding: 4rem 2rem; background: rgba(255,255,255,0.9);
            backdrop-filter: blur(20px); border-radius: 20px; border: 1px solid rgba(34,139,34,0.2);
            box-shadow: 0 4px 15px rgba(34,139,34,0.1);
        }
        .alert { padding: 1rem; border-radius: 12px; margin-bottom: 1rem; border: 1px solid; }
        .alert-success { background: rgba(34,139,34,0.1); border-color: rgba(34,139,34,0.3); color: #1e4620; }
        .alert-error { background: rgba(220,53,69,0.1); border-color: rgba(220,53,69,0.3); color: #721c24; }
        @media (max-width: 768px) {
            .container { padding: 1rem; }
            .header h1 { font-size: 2rem; }
            .users-grid { grid-template-columns: 1fr; gap: 1.5rem; }
            .nav-container { padding: 0 1rem; }
            .actions { justify-content: center; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/posts" class="logo"><i class="fas fa-leaf"></i> MiniBlog</a>
            <div class="nav-links">
                <a href="/posts" class="nav-link">Posts</a>
                <a href="/users" class="nav-link">Users</a>
                <a href="/admin" class="nav-link">Admin</a>
                <a href="/profile" class="nav-link">Profile</a>
                <span style="color: #4a6741; font-size: 0.9rem;"><i class="fas fa-user-circle"></i> <span th:text="${currentUsername}"></span></span>
                <form th:action="@{/auth/logout}" method="post" style="margin: 0;">
                    <button type="submit" style="background: none; border: none; color: #4a6741; font-weight: 500; cursor: pointer; font-family: inherit; font-size: 1rem;">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="header">
            <h1>Users</h1>
            <p>Manage blog users and authors</p>
        </div>

        <div th:if="${successMessage}" class="alert alert-success">
            <i class="fas fa-check-circle"></i> <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-error">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${errorMessage}"></span>
        </div>

        <div class="actions">
            <a href="/users/new" class="btn btn-primary"><i class="fas fa-plus"></i> Add New User</a>
        </div>

        <div th:if="${not #lists.isEmpty(users)}" class="users-grid">
            <div th:each="user : ${users}" class="user-card">
                <div class="user-content">
                    <div class="user-icon"><i class="fas fa-user"></i></div>
                    <div class="user-name" th:text="${user.username}">Username</div>
                    <div class="user-email" th:text="${user.email}">email@example.com</div>
                    <div class="user-stats">
                        <div class="stat-item">
                            <span class="stat-number" th:text="${#lists.size(user.posts)}">0</span>
                            <span class="stat-label">Posts</span>
                        </div>
                    </div>
                    <div class="user-actions">
                        <a th:href="@{/users/edit/{id}(id=${user.id})}" class="btn btn-secondary btn-small">
                            <i class="fas fa-edit"></i> Edit
                        </a>
                        <a th:href="@{/users/delete/{id}(id=${user.id})}"
                           class="btn btn-danger btn-small"
                           onclick="return confirm('Are you sure you want to delete this user?')">
                            <i class="fas fa-trash"></i> Delete
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(users)}" class="empty-state">
            <h3 style="color:#2d5016; margin-bottom:1rem;">No Users Found</h3>
            <a href="/users/new" class="btn btn-primary"><i class="fas fa-plus"></i> Create First User</a>
        </div>
    </div>
</body>
</html>
