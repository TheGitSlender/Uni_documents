<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit} ? 'Edit User - MiniBlog' : 'New User - MiniBlog'">User Form - MiniBlog</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #f8fff8 0%, #e8f5e8 25%, #d4f1d4 50%, #c1edc1 75%, #b8e6b8 100%);
            background-size: 400% 400%;
            animation: modernGradient 20s ease infinite;
            color: #2d5016;
            line-height: 1.6;
        }

        @keyframes modernGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(34, 139, 34, 0.2);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 10px rgba(34, 139, 34, 0.1);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #228b22;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-nav {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .back-link {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #4a6741;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #228b22;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        .form-header {
            text-align: center;
            margin: 2rem 0 3rem 0;
        }

        .form-title {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #228b22 0%, #32cd32 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            letter-spacing: -1px;
        }

        .form-subtitle {
            color: #4a6741;
            font-size: 1.1rem;
        }

        .form-container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(34, 139, 34, 0.2);
            padding: 3rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(34, 139, 34, 0.1);
        }

        .form-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #228b22 0%, #32cd32 100%);
        }

        .form-group {
            margin-bottom: 2rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #2d5016;
            font-size: 0.95rem;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid rgba(34, 139, 34, 0.2);
            border-radius: 12px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.8);
            transition: all 0.3s ease;
            color: #2d5016;
        }

        .form-input:focus {
            outline: none;
            border-color: #228b22;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 0 3px rgba(34, 139, 34, 0.1);
        }

        .form-input::placeholder {
            color: #4a6741;
            opacity: 0.7;
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 3rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 12px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, #228b22 0%, #32cd32 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(34, 139, 34, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(34, 139, 34, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.7);
            color: #2d5016;
            border: 1px solid rgba(34, 139, 34, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(34, 139, 34, 0.1);
            border-color: rgba(34, 139, 34, 0.5);
            transform: translateY(-2px);
        }

        .alert {
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            border: 1px solid;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .alert-success {
            background: rgba(34, 139, 34, 0.1);
            border-color: rgba(34, 139, 34, 0.3);
            color: #1e4620;
        }

        .alert-error {
            background: rgba(220, 53, 69, 0.1);
            border-color: rgba(220, 53, 69, 0.3);
            color: #721c24;
        }

        .form-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #228b22 0%, #32cd32 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 1.5rem;
            color: white;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .form-title {
                font-size: 2rem;
            }

            .form-container {
                padding: 2rem;
            }

            .form-actions {
                flex-direction: column;
                align-items: center;
            }

            .nav-container {
                padding: 0 1rem;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/posts" class="logo">
                <i class="fas fa-leaf"></i>
                MiniBlog
            </a>
            <div class="back-nav">
                <a href="/users" class="back-link">
                    <i class="fas fa-arrow-left"></i>
                    Back to Users
                </a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="form-header">
            <h1 class="form-title" th:text="${isEdit} ? 'Edit User' : 'New User'">User Form</h1>
            <p class="form-subtitle" th:text="${isEdit} ? 'Update user information' : 'Create a new user account'">User form subtitle</p>
        </div>

        <!-- Flash Messages -->
        <div th:if="${successMessage}" class="alert alert-success">
            <i class="fas fa-check-circle"></i> <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-error">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${errorMessage}"></span>
        </div>

        <div class="form-container">
            <div class="form-icon">
                <i class="fas fa-user"></i>
            </div>

            <form th:object="${user}" th:action="${isEdit} ? '/users/update/' + ${user.id} : '/users'" method="post">
                <div class="form-group">
                    <label for="username" class="form-label">
                        <i class="fas fa-user"></i> Username
                    </label>
                    <input type="text"
                           id="username"
                           th:field="*{username}"
                           class="form-input"
                           placeholder="Enter username"
                           required>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">
                        <i class="fas fa-envelope"></i> Email
                    </label>
                    <input type="email"
                           id="email"
                           th:field="*{email}"
                           class="form-input"
                           placeholder="Enter email address"
                           required>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <input type="password"
                           id="password"
                           th:field="*{password}"
                           class="form-input"
                           placeholder="Enter password"
                           th:required="${!isEdit}">
                    <small th:if="${isEdit}" style="color: #4a6741; font-size: 0.85rem;">Leave blank to keep current password</small>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i>
                        <span th:text="${isEdit} ? 'Update User' : 'Create User'">Save</span>
                    </button>
                    <a href="/users" class="btn btn-secondary">
                        <i class="fas fa-times"></i>
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
