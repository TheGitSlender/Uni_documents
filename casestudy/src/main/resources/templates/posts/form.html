<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit} ? 'Edit Post - MiniBlog' : 'New Post - MiniBlog'">Post Form - MiniBlog</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #f8fff8 0%, #e8f5e8 25%, #d4f1d4 50%, #c1edc1 75%, #b8e6b8 100%);
            color: #2d5016; line-height: 1.6;
        }
        .navbar {
            background: rgba(255,255,255,0.95); backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(34,139,34,0.2); padding: 1rem 0;
            position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 10px rgba(34,139,34,0.1);
        }
        .nav-container {
            max-width: 1200px; margin: 0 auto;
            display: flex; justify-content: space-between; align-items: center; padding: 0 2rem;
        }
        .logo { font-size: 1.5rem; font-weight: 700; color: #228b22; text-decoration: none; display: flex; align-items: center; gap: 0.5rem; }
        .nav-links { display: flex; gap: 2rem; align-items: center; }
        .nav-link { color: #4a6741; text-decoration: none; font-weight: 500; transition: color 0.3s ease; }
        .nav-link:hover { color: #228b22; }
        .nav-logout { background: none; border: none; color: #4a6741; font-weight: 500; cursor: pointer; font-family: inherit; font-size: 1rem; transition: color 0.3s ease; }
        .nav-logout:hover { color: #dc3545; }
        .container { max-width: 900px; margin: 0 auto; padding: 2rem; }
        .form-header { text-align: center; margin: 2rem 0 3rem 0; }
        .form-title {
            font-size: 2.5rem; font-weight: 700;
            background: linear-gradient(135deg, #228b22 0%, #32cd32 100%);
            background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem; letter-spacing: -1px;
        }
        .form-subtitle { color: #4a6741; font-size: 1.1rem; }
        .form-container {
            background: rgba(255,255,255,0.9); backdrop-filter: blur(20px);
            border-radius: 20px; border: 1px solid rgba(34,139,34,0.2);
            padding: 3rem; position: relative; overflow: hidden; box-shadow: 0 4px 15px rgba(34,139,34,0.1);
        }
        .form-container::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, #228b22 0%, #32cd32 100%);
        }
        .form-group { margin-bottom: 2rem; }
        .form-label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: #2d5016; font-size: 0.95rem; }
        .form-textarea {
            width: 100%; padding: 12px 16px;
            border: 2px solid rgba(34,139,34,0.2); border-radius: 12px;
            font-size: 1rem; background: rgba(255,255,255,0.8);
            transition: all 0.3s ease; color: #2d5016; font-family: inherit;
            min-height: 220px; resize: vertical;
        }
        .form-textarea:focus { outline: none; border-color: #228b22; background: rgba(255,255,255,0.95); box-shadow: 0 0 0 3px rgba(34,139,34,0.1); }
        .form-textarea::placeholder { color: #4a6741; opacity: 0.7; }
        .form-input {
            width: 100%; padding: 12px 16px;
            border: 2px solid rgba(34,139,34,0.2); border-radius: 12px;
            font-size: 1rem; background: rgba(255,255,255,0.8);
            transition: all 0.3s ease; color: #2d5016; font-family: inherit;
        }
        .form-input:focus { outline: none; border-color: #228b22; background: rgba(255,255,255,0.95); box-shadow: 0 0 0 3px rgba(34,139,34,0.1); }
        .author-hint { font-size: 0.9rem; color: #4a6741; margin-bottom: 2rem; display: flex; align-items: center; gap: 0.5rem; }
        .form-actions { display: flex; gap: 1rem; justify-content: center; margin-top: 2rem; }
        .btn {
            display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 12px 24px; border-radius: 12px; text-decoration: none;
            font-weight: 600; transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
            border: none; cursor: pointer; font-size: 0.95rem; font-family: inherit;
        }
        .btn-primary { background: linear-gradient(135deg, #228b22 0%, #32cd32 100%); color: white; box-shadow: 0 4px 15px rgba(34,139,34,0.3); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(34,139,34,0.4); }
        .btn-secondary { background: rgba(255,255,255,0.7); color: #2d5016; border: 1px solid rgba(34,139,34,0.3); }
        .btn-secondary:hover { background: rgba(34,139,34,0.1); border-color: rgba(34,139,34,0.5); transform: translateY(-2px); }
        .alert { padding: 1rem; border-radius: 12px; margin-bottom: 2rem; border: 1px solid; display: flex; align-items: center; gap: 0.5rem; }
        .alert-success { background: rgba(34,139,34,0.1); border-color: rgba(34,139,34,0.3); color: #1e4620; }
        .alert-error { background: rgba(220,53,69,0.1); border-color: rgba(220,53,69,0.3); color: #721c24; }
        .form-icon {
            width: 60px; height: 60px; background: linear-gradient(135deg, #228b22 0%, #32cd32 100%);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.5rem; font-size: 1.5rem; color: white;
        }
        .tag-input-wrapper {
            display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center;
            border: 2px solid rgba(34,139,34,0.2); border-radius: 12px;
            padding: 8px 12px; background: rgba(255,255,255,0.8); cursor: text;
            min-height: 46px; transition: all 0.3s ease;
        }
        .tag-input-wrapper:focus-within { border-color: #228b22; background: rgba(255,255,255,0.95); box-shadow: 0 0 0 3px rgba(34,139,34,0.1); }
        .tag-chip { display: inline-flex; align-items: center; gap: 0.3rem; background: rgba(34,139,34,0.12); color: #228b22; border: 1px solid rgba(34,139,34,0.35); border-radius: 20px; padding: 2px 10px; font-size: 0.85rem; font-weight: 600; }
        .tag-chip button { background: none; border: none; cursor: pointer; color: #228b22; font-size: 1rem; line-height: 1; padding: 0 2px; }
        .tag-chip button:hover { color: #dc3545; }
        .tag-text-input { border: none; outline: none; background: transparent; font-family: inherit; font-size: 0.95rem; color: #2d5016; min-width: 120px; flex: 1; }
        .tag-hint { font-size: 0.8rem; color: #4a6741; margin-top: 0.4rem; }
        @media (max-width: 768px) {
            .container { padding: 1rem; }
            .form-title { font-size: 2rem; }
            .form-container { padding: 2rem; }
            .form-actions { flex-direction: column; align-items: center; }
            .nav-container { padding: 0 1rem; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/posts" class="logo"><i class="fas fa-leaf"></i> MiniBlog</a>
            <div class="nav-links">
                <a href="/posts" class="nav-link">Posts</a>
                <a th:if="${isAdmin}" href="/admin" class="nav-link">Admin</a>
                <a href="/profile" class="nav-link">Profile</a>
                <form th:action="@{/auth/logout}" method="post" style="margin: 0;">
                    <button type="submit" class="nav-logout"><i class="fas fa-sign-out-alt"></i> Logout</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="form-header">
            <h1 class="form-title" th:text="${isEdit} ? 'Edit Post' : 'New Post'">Post Form</h1>
            <p class="form-subtitle" th:text="${isEdit} ? 'Update your post' : 'Share your thoughts with the world'">Subtitle</p>
        </div>

        <div th:if="${successMessage}" class="alert alert-success">
            <i class="fas fa-check-circle"></i> <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-error">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${errorMessage}"></span>
        </div>

        <div class="form-container">
            <div class="form-icon"><i class="fas fa-edit"></i></div>

            <div class="author-hint">
                <i class="fas fa-user-circle"></i>
                <span>Posting as: <strong th:text="${currentUsername}">you</strong></span>
            </div>

            <form th:object="${post}" th:action="${isEdit} ? '/posts/update/' + ${post.id} : '/posts'" method="post">

                <!-- Type selector (create only) -->
                <div class="form-group" th:if="${!isEdit}">
                    <label class="form-label"><i class="fas fa-list-ul"></i> Post Type</label>
                    <div style="display:flex; gap:2rem;">
                        <label style="display:flex; align-items:center; gap:0.5rem; cursor:pointer; font-weight:500;">
                            <input type="radio" name="type" value="article" id="typeArticle" checked
                                   onchange="switchType('article')"> Article
                        </label>
                        <label style="display:flex; align-items:center; gap:0.5rem; cursor:pointer; font-weight:500;">
                            <input type="radio" name="type" value="video" id="typeVideo"
                                   onchange="switchType('video')"> Video
                        </label>
                    </div>
                </div>

                <!-- Content field (Article) -->
                <div class="form-group" id="contentGroup"
                     th:style="${isEdit and postType == 'video'} ? 'display:none' : ''">
                    <label for="content" class="form-label"><i class="fas fa-align-left"></i> Content</label>
                    <textarea id="content" name="content" class="form-textarea"
                              th:text="${post.content}" placeholder="Write your post here..." rows="10"></textarea>
                </div>

                <!-- URL field (VideoPost) -->
                <div class="form-group" id="urlGroup"
                     th:style="${isEdit and postType == 'video'} ? '' : 'display:none'">
                    <label for="url" class="form-label"><i class="fas fa-video"></i> Video URL</label>
                    <input type="url" id="url" name="url" class="form-input"
                           th:value="${post.url}" placeholder="https://..." />
                </div>

                <div class="form-group">
                    <label class="form-label"><i class="fas fa-tag"></i> Tags</label>
                    <div class="tag-input-wrapper" id="tagWrapper">
                        <span th:each="tag : ${post.tags}" class="tag-chip" th:data-name="${tag.name}">
                            #<span th:text="${tag.name}"></span>
                            <button type="button" onclick="removeChip(this)">&#x2715;</button>
                        </span>
                        <input type="text" class="tag-text-input" id="tagTextInput"
                               placeholder="Add a tag..." autocomplete="off" />
                    </div>
                    <p class="tag-hint">Press <kbd>Enter</kbd> or <kbd>,</kbd> to add a tag.</p>
                    <input type="hidden" name="tagNames" id="tagNamesInput" />
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i>
                        <span th:text="${isEdit} ? 'Update Post' : 'Publish Post'">Save</span>
                    </button>
                    <a href="/posts" class="btn btn-secondary"><i class="fas fa-times"></i> Cancel</a>
                </div>
            </form>
        </div>
    </div>
<script>
    function switchType(type) {
        var contentGroup = document.getElementById('contentGroup');
        var urlGroup = document.getElementById('urlGroup');
        if (type === 'video') {
            contentGroup.style.display = 'none';
            urlGroup.style.display = '';
        } else {
            contentGroup.style.display = '';
            urlGroup.style.display = 'none';
        }
    }

    const wrapper = document.getElementById('tagWrapper');
    const textInput = document.getElementById('tagTextInput');
    const hiddenInput = document.getElementById('tagNamesInput');

    function getChipNames() {
        return Array.from(wrapper.querySelectorAll('.tag-chip'))
            .map(c => c.dataset.name);
    }

    function syncHidden() {
        hiddenInput.value = getChipNames().join(',');
    }

    function addChip(name) {
        name = name.trim().replace(/[^a-zA-Z0-9_\-]/g, '');
        if (!name) return;
        if (getChipNames().includes(name)) return;
        const chip = document.createElement('span');
        chip.className = 'tag-chip';
        chip.dataset.name = name;
        chip.innerHTML = '#' + name + ' <button type="button" onclick="removeChip(this)">&#x2715;</button>';
        wrapper.insertBefore(chip, textInput);
        syncHidden();
    }

    function removeChip(btn) {
        btn.closest('.tag-chip').remove();
        syncHidden();
    }

    textInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ',') {
            e.preventDefault();
            addChip(this.value);
            this.value = '';
        } else if (e.key === 'Backspace' && this.value === '') {
            const chips = wrapper.querySelectorAll('.tag-chip');
            if (chips.length) chips[chips.length - 1].remove();
            syncHidden();
        }
    });

    wrapper.addEventListener('click', () => textInput.focus());
    syncHidden();
</script>
</body>
</html>
