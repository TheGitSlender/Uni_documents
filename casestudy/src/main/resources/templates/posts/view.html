<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Post by ' + ${post.authorName} + ' - MiniBlog'">Post - MiniBlog</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #f8fff8 0%, #e8f5e8 25%, #d4f1d4 50%, #c1edc1 75%, #b8e6b8 100%);
            color: #2d5016; line-height: 1.6;
        }
        .navbar {
            background: rgba(255,255,255,0.95); backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(34,139,34,0.2); padding: 1rem 0;
            position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 10px rgba(34,139,34,0.1);
        }
        .nav-container {
            max-width: 1200px; margin: 0 auto;
            display: flex; justify-content: space-between; align-items: center; padding: 0 2rem;
        }
        .logo { font-size: 1.5rem; font-weight: 700; color: #228b22; text-decoration: none; display: flex; align-items: center; gap: 0.5rem; }
        .nav-links { display: flex; gap: 1.5rem; align-items: center; }
        .nav-link { color: #4a6741; text-decoration: none; font-weight: 500; transition: color 0.3s ease; }
        .nav-link:hover { color: #228b22; }
        .nav-user { color: #4a6741; font-size: 0.9rem; }
        .nav-logout { background: none; border: none; color: #4a6741; font-weight: 500; cursor: pointer; font-family: inherit; font-size: 1rem; transition: color 0.3s ease; }
        .nav-logout:hover { color: #dc3545; }
        .container { max-width: 900px; margin: 0 auto; padding: 2rem; }
        .article-header { text-align: center; margin: 2rem 0 3rem 0; }
        .article-meta {
            display: flex; justify-content: center; gap: 2rem;
            margin-bottom: 3rem; flex-wrap: wrap;
        }
        .meta-item { display: flex; align-items: center; gap: 0.5rem; color: #4a6741; font-size: 0.95rem; }
        .meta-item i { color: #228b22; }
        .article-content {
            background: rgba(255,255,255,0.9); backdrop-filter: blur(20px);
            border-radius: 20px; border: 1px solid rgba(34,139,34,0.2);
            padding: 3rem; margin-bottom: 2rem; position: relative; overflow: hidden;
            box-shadow: 0 4px 15px rgba(34,139,34,0.1);
        }
        .article-content::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, #228b22 0%, #32cd32 100%);
        }
        .content-text { color: #2d5016; font-size: 1.125rem; line-height: 1.8; text-align: justify; white-space: pre-wrap; }
        .tag-list { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1.5rem; }
        .tag { display: inline-flex; align-items: center; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; background: rgba(34,139,34,0.1); color: #228b22; border: 1px solid rgba(34,139,34,0.3); text-decoration: none; }
        .tag:hover { background: rgba(34,139,34,0.2); }
        .actions { display: flex; justify-content: center; gap: 1rem; margin-top: 3rem; }
        .btn {
            display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 12px 24px; border-radius: 12px; text-decoration: none;
            font-weight: 600; transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
            border: none; cursor: pointer; font-size: 0.95rem;
        }
        .btn-primary { background: linear-gradient(135deg, #228b22 0%, #32cd32 100%); color: white; box-shadow: 0 4px 15px rgba(34,139,34,0.3); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(34,139,34,0.4); }
        .btn-secondary { background: rgba(255,255,255,0.7); color: #2d5016; border: 1px solid rgba(34,139,34,0.3); }
        .btn-secondary:hover { background: rgba(34,139,34,0.1); border-color: rgba(34,139,34,0.5); transform: translateY(-2px); }
        .btn-danger { background: linear-gradient(135deg, #dc3545 0%, #e85d75 100%); color: white; box-shadow: 0 4px 15px rgba(220,53,69,0.3); }
        .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(220,53,69,0.4); }
        .comments-section { margin-top: 3rem; }
        .comments-section h3 { color: #228b22; font-size: 1.25rem; margin-bottom: 1.5rem; }
        .comment-card {
            background: rgba(255,255,255,0.85); border-radius: 12px;
            border: 1px solid rgba(34,139,34,0.15); padding: 1.25rem;
            margin-bottom: 1rem;
        }
        .comment-meta { display: flex; gap: 1.5rem; align-items: center; font-size: 0.875rem; color: #4a6741; margin-bottom: 0.75rem; flex-wrap: wrap; }
        .comment-actions { margin-left: auto; display: flex; gap: 0.5rem; align-items: center; }
        .comment-btn { background: none; border: none; cursor: pointer; font-size: 0.82rem; font-weight: 600; padding: 2px 6px; border-radius: 6px; font-family: inherit; }
        .comment-btn-edit { color: #228b22; }
        .comment-btn-edit:hover { background: rgba(34,139,34,0.1); }
        .comment-btn-delete { color: #dc3545; }
        .comment-btn-delete:hover { background: rgba(220,53,69,0.1); }
        .comment-edit-form { margin-top: 0.75rem; display: none; }
        .comment-edit-form textarea { width: 100%; padding: 0.6rem; border: 1px solid rgba(34,139,34,0.3); border-radius: 8px; font-family: inherit; font-size: 0.9rem; resize: vertical; background: rgba(255,255,255,0.9); color: #2d5016; }
        .comment-edit-actions { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
        .comment-content { color: #2d5016; line-height: 1.6; }
        .comment-form { margin-top: 2rem; background: rgba(255,255,255,0.85); border-radius: 12px; border: 1px solid rgba(34,139,34,0.15); padding: 1.5rem; }
        .comment-form h4 { color: #228b22; margin-bottom: 1rem; }
        .comment-form textarea { width: 100%; padding: 0.75rem; border: 1px solid rgba(34,139,34,0.3); border-radius: 8px; font-family: inherit; font-size: 0.95rem; resize: vertical; background: rgba(255,255,255,0.9); color: #2d5016; margin-bottom: 0.75rem; }
        .comment-form textarea:focus { outline: none; border-color: #228b22; }
        .reactions-bar { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1.5rem 0 0; }
        .reaction-btn {
            display: inline-flex; align-items: center; gap: 0.4rem;
            padding: 6px 14px; border-radius: 20px; font-size: 0.9rem; font-weight: 600;
            cursor: pointer; border: 1px solid rgba(34,139,34,0.25); background: rgba(34,139,34,0.07);
            color: #2d5016; font-family: inherit; transition: all 0.2s ease;
        }
        .reaction-btn:hover { background: rgba(34,139,34,0.15); border-color: rgba(34,139,34,0.4); }
        .reaction-btn.active { background: #228b22; color: white; border-color: #228b22; }
        .reaction-count { font-size: 0.8rem; opacity: 0.85; }
        @media (max-width: 768px) {
            .container { padding: 1rem; }
            .article-content { padding: 2rem; }
            .article-meta { flex-direction: column; gap: 1rem; }
            .actions { flex-direction: column; align-items: center; }
            .nav-container { padding: 0 1rem; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/posts" class="logo"><i class="fas fa-code"></i> MiniBlog</a>
            <div class="nav-links">
                <a href="/posts" class="nav-link">Posts</a>
                <th:block th:if="${isAuthenticated}">
                    <a th:if="${isAdmin}" href="/users" class="nav-link">Users</a>
                    <a th:if="${isAdmin}" href="/admin" class="nav-link">Admin</a>
                    <a href="/profile" class="nav-link">Profile</a>
                    <span class="nav-user"><i class="fas fa-user-circle"></i> <span th:text="${currentUsername}"></span></span>
                    <form th:action="@{/auth/logout}" method="post" style="margin: 0;">
                        <button type="submit" class="nav-logout"><i class="fas fa-sign-out-alt"></i> Logout</button>
                    </form>
                </th:block>
                <th:block th:if="${!isAuthenticated}">
                    <a href="/auth/login" class="nav-link"><i class="fas fa-sign-in-alt"></i> Login</a>
                </th:block>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="article-header">
            <div class="article-meta">
                <div class="meta-item">
                    <i class="fas fa-user"></i>
                    <span th:text="${post.authorName}">Author</span>
                </div>
            </div>
        </div>

        <div class="article-content">
            <!-- Article -->
            <div th:if="${post.content != null}" class="content-text" th:text="${post.content}">Content here...</div>
            <!-- VideoPost -->
            <div th:if="${post.url != null}" class="content-text">
                <i class="fas fa-video"></i>
                <a th:href="${post.url}" th:text="${post.url}" target="_blank" rel="noopener">Video URL</a>
            </div>
            <div th:if="${not #sets.isEmpty(post.tags)}" class="tag-list">
                <a th:each="tag : ${post.tags}"
                   th:href="@{/posts(tags=${tag.name})}"
                   th:text="'#' + ${tag.name}"
                   class="tag"></a>
            </div>
        </div>

        <div th:if="${isAuthenticated}" class="reactions-bar">
            <form th:each="rType : ${reactionTypes}"
                  th:action="@{/posts/{id}/react(id=${post.id})}" method="post" style="margin:0;">
                <input type="hidden" name="type" th:value="${rType.name()}">
                <button type="submit"
                        th:classappend="${userReaction != null and userReaction.name() == rType.name()} ? ' active' : ''"
                        class="reaction-btn">
                    <span th:text="${rType.name()}"></span>
                    <span class="reaction-count" th:text="${reactionCounts[rType.name()]}">0</span>
                </button>
            </form>
        </div>
        <div th:if="${not isAuthenticated}" class="reactions-bar" style="color:#4a6741; font-size:0.9rem; padding-top:1rem;">
            <span th:each="rType : ${reactionTypes}" style="margin-right:1rem;">
                <span th:text="${rType.name()}"></span>
                <span th:text="${reactionCounts[rType.name()]}" style="font-weight:600;"></span>
            </span>
        </div>

        <div class="actions">
            <a href="/posts" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back</a>
            <th:block th:if="${isAuthenticated and currentUsername == post.authorName}">
                <a th:href="@{/posts/edit/{id}(id=${post.id})}" class="btn btn-primary">
                    <i class="fas fa-edit"></i> Edit
                </a>
            </th:block>
            <th:block th:if="${isAuthenticated and (currentUsername == post.authorName or isAdmin)}">
                <form th:action="@{/posts/delete/{id}(id=${post.id})}" method="post" style="margin:0;">
                    <button type="submit" class="btn btn-danger"
                            onclick="return confirm('Delete this post?')">
                        <i class="fas fa-trash"></i> Delete
                    </button>
                </form>
            </th:block>
        </div>

        <div class="comments-section">
            <h3>Comments (<span th:text="${#lists.size(post.comments)}">0</span>)</h3>

            <div th:each="comment : ${post.comments}" class="comment-card" th:id="'comment-' + ${comment.id}">
                <div class="comment-meta">
                    <span><i class="fas fa-user"></i> <span th:text="${comment.authorName}"></span></span>
                    <span><i class="fas fa-clock"></i> <span th:text="${#temporals.format(comment.creationDate, 'yyyy-MM-dd HH:mm')}"></span></span>
                    <div th:if="${isAuthenticated and (currentUsername == comment.authorName or isAdmin)}" class="comment-actions">
                        <button th:if="${currentUsername == comment.authorName}"
                                type="button" class="comment-btn comment-btn-edit"
                                th:data-id="${comment.id}"
                                onclick="toggleEdit(this.dataset.id)">Edit</button>
                        <form th:action="@{/posts/{postId}/comments/{id}/delete(postId=${post.id},id=${comment.id})}"
                              method="post" style="margin:0;">
                            <button type="submit" class="comment-btn comment-btn-delete"
                                    onclick="return confirm('Delete this comment?')">Delete</button>
                        </form>
                    </div>
                </div>
                <div class="comment-content" th:id="'comment-text-' + ${comment.id}" th:text="${comment.content}"></div>
                <div class="comment-edit-form" th:id="'comment-edit-' + ${comment.id}"
                     th:if="${isAuthenticated and currentUsername == comment.authorName}">
                    <form th:action="@{/posts/{postId}/comments/{id}/update(postId=${post.id},id=${comment.id})}" method="post">
                        <textarea name="content" rows="3" th:text="${comment.content}" required></textarea>
                        <div class="comment-edit-actions">
                            <button type="submit" class="btn btn-primary" style="padding:6px 16px;font-size:0.85rem;">Save</button>
                            <button type="button" class="btn btn-secondary" style="padding:6px 16px;font-size:0.85rem;"
                                    th:data-id="${comment.id}"
                                    onclick="toggleEdit(this.dataset.id)">Cancel</button>
                        </div>
                    </form>
                </div>
            </div>

            <div th:if="${isAuthenticated}" class="comment-form">
                <h4>Add a comment</h4>
                <form th:action="@{/posts/{postId}/comments(postId=${post.id})}" method="post">
                    <textarea name="content" rows="3" placeholder="Write your comment..." required></textarea>
                    <button type="submit" class="btn btn-primary">Post Comment</button>
                </form>
            </div>
        </div>
    </div>
<script>
function toggleEdit(id) {
    var text = document.getElementById('comment-text-' + id);
    var form = document.getElementById('comment-edit-' + id);
    if (form.style.display === 'block') {
        form.style.display = 'none';
        text.style.display = '';
    } else {
        form.style.display = 'block';
        text.style.display = 'none';
    }
}
</script>
</body>
</html>
