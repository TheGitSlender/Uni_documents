<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniBlog</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #f8fff8 0%, #e8f5e8 25%, #d4f1d4 50%, #c1edc1 75%, #b8e6b8 100%);
            background-size: 400% 400%;
            animation: modernGradient 20s ease infinite;
            color: #2d5016; line-height: 1.6;
        }
        @keyframes modernGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .navbar {
            background: rgba(255,255,255,0.95); backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(34,139,34,0.2); padding: 1rem 0;
            position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 10px rgba(34,139,34,0.1);
        }
        .nav-container {
            max-width: 1200px; margin: 0 auto;
            display: flex; justify-content: space-between; align-items: center; padding: 0 2rem;
        }
        .logo { font-size: 1.5rem; font-weight: 700; color: #228b22; text-decoration: none; display: flex; align-items: center; gap: 0.5rem; }
        .nav-links { display: flex; gap: 1.5rem; align-items: center; }
        .nav-link { color: #4a6741; text-decoration: none; font-weight: 500; transition: color 0.3s ease; }
        .nav-link:hover { color: #228b22; }
        .nav-user { color: #4a6741; font-size: 0.9rem; }
        .nav-logout { background: none; border: none; color: #4a6741; font-weight: 500; cursor: pointer; font-family: inherit; font-size: 1rem; transition: color 0.3s ease; }
        .nav-logout:hover { color: #dc3545; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        .header { text-align: center; margin: 2rem 0 4rem 0; }
        .header h1 {
            font-size: 3rem; font-weight: 700;
            background: linear-gradient(135deg, #228b22 0%, #32cd32 100%);
            background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 1rem; letter-spacing: -1px;
        }
        .header p { color: #4a6741; font-size: 1.2rem; max-width: 600px; margin: 0 auto; }
        .posts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 2rem; margin-top: 2rem; }
        .post-card {
            background: rgba(255,255,255,0.9); backdrop-filter: blur(20px);
            border-radius: 20px; border: 1px solid rgba(34,139,34,0.2); overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4,0,0.2,1); position: relative;
            box-shadow: 0 4px 15px rgba(34,139,34,0.1);
        }
        .post-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, #228b22 0%, #32cd32 100%); opacity: 0; transition: opacity 0.3s ease;
        }
        .post-card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(34,139,34,0.15); border-color: rgba(34,139,34,0.4); }
        .post-card:hover::before { opacity: 1; }
        .post-content { padding: 2rem; }
        .post-icon {
            width: 50px; height: 50px; background: linear-gradient(135deg, #228b22 0%, #32cd32 100%);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            margin-bottom: 1.5rem; font-size: 1.5rem; color: white;
        }
        .post-preview {
            font-size: 1rem; color: #2d5016; line-height: 1.6; margin-bottom: 1rem;
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
        }
        .post-preview a { color: inherit; text-decoration: none; }
        .post-preview a:hover { color: #228b22; }
        .post-meta { color: #4a6741; font-size: 0.9rem; display: flex; align-items: center; gap: 1rem; }
        .meta-item { display: flex; align-items: center; gap: 0.5rem; }
        .tag-filter { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 2rem; align-items: center; }
        .tag-filter-label { font-size: 0.9rem; color: #4a6741; font-weight: 600; margin-right: 0.25rem; }
        .tag-pill { display: inline-flex; align-items: center; padding: 4px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; text-decoration: none; border: 1px solid rgba(34,139,34,0.3); color: #228b22; background: rgba(34,139,34,0.06); transition: all 0.2s; }
        .tag-pill:hover { background: rgba(34,139,34,0.15); }
        .tag-pill.active { background: #228b22; color: white; border-color: #228b22; }
        .tag-pill-clear { background: rgba(220,53,69,0.06); color: #dc3545; border-color: rgba(220,53,69,0.3); }
        .tag-pill-clear:hover { background: rgba(220,53,69,0.15); }
        .tag-pill-btn { cursor: pointer; font-family: inherit; }
        .post-tag-list { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.75rem; }
        .post-tag { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; background: rgba(34,139,34,0.1); color: #228b22; border: 1px solid rgba(34,139,34,0.25); text-decoration: none; }
        .post-tag:hover { background: rgba(34,139,34,0.2); }
        .post-tag-btn { cursor: pointer; font-family: inherit; }
        .post-tag.active { background: #228b22; color: white; border-color: #228b22; }
        .post-actions { margin-top: 1rem; display: flex; gap: 0.5rem; justify-content: center; }
        .empty-state {
            text-align: center; padding: 4rem 2rem; background: rgba(255,255,255,0.9);
            backdrop-filter: blur(20px); border-radius: 20px; border: 1px solid rgba(34,139,34,0.2);
            box-shadow: 0 4px 15px rgba(34,139,34,0.1);
        }
        .empty-icon {
            width: 80px; height: 80px; background: linear-gradient(135deg, #228b22 0%, #32cd32 100%);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            margin: 0 auto 2rem; font-size: 2rem; color: white;
        }
        .empty-title { font-size: 1.5rem; margin-bottom: 1rem; color: #2d5016; }
        .empty-text { color: #4a6741; font-size: 1.1rem; }
        .btn {
            display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 12px 24px; border-radius: 12px; text-decoration: none;
            font-weight: 600; transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
            border: none; cursor: pointer; font-size: 0.95rem;
        }
        .btn-primary { background: linear-gradient(135deg, #228b22 0%, #32cd32 100%); color: white; box-shadow: 0 4px 15px rgba(34,139,34,0.3); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(34,139,34,0.4); }
        .btn-secondary { background: rgba(255,255,255,0.7); color: #2d5016; border: 1px solid rgba(34,139,34,0.3); }
        .btn-secondary:hover { background: rgba(34,139,34,0.1); border-color: rgba(34,139,34,0.5); transform: translateY(-2px); }
        .btn-danger { background: linear-gradient(135deg, #dc3545 0%, #e85d75 100%); color: white; box-shadow: 0 4px 15px rgba(220,53,69,0.3); }
        .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(220,53,69,0.4); }
        .alert { padding: 1rem; border-radius: 12px; margin-bottom: 1rem; border: 1px solid; background: rgba(34,139,34,0.1); border-color: rgba(34,139,34,0.3); color: #1e4620; display: flex; align-items: center; gap: 0.5rem; }
        .alert-error { background: rgba(220,53,69,0.1); border-color: rgba(220,53,69,0.3); color: #721c24; }
        .actions { display: flex; justify-content: flex-end; margin-bottom: 2rem; }
        @media (max-width: 768px) {
            .container { padding: 1rem; }
            .header h1 { font-size: 2rem; }
            .posts-grid { grid-template-columns: 1fr; gap: 1.5rem; }
            .nav-container { padding: 0 1rem; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/posts" class="logo"><i class="fas fa-code"></i> MiniBlog</a>
            <div class="nav-links">
                <a href="/posts" class="nav-link">Posts</a>
                <th:block th:if="${isAuthenticated}">
                    <a th:if="${isAdmin}" href="/users" class="nav-link">Users</a>
                    <span class="nav-user"><i class="fas fa-user-circle"></i> <span th:text="${currentUsername}"></span></span>
                    <form th:action="@{/auth/logout}" method="post" style="margin: 0;">
                        <button type="submit" class="nav-logout"><i class="fas fa-sign-out-alt"></i> Logout</button>
                    </form>
                </th:block>
                <th:block th:if="${!isAuthenticated}">
                    <a href="/auth/login" class="nav-link"><i class="fas fa-sign-in-alt"></i> Login</a>
                    <a href="/auth/register" class="nav-link"><i class="fas fa-user-plus"></i> Register</a>
                </th:block>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="header">
            <h1>MiniBlog</h1>
            <p>Discover and share thoughts from the community</p>
        </div>

        <div th:if="${successMessage}" class="alert">
            <i class="fas fa-check-circle"></i> <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-error">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${errorMessage}"></span>
        </div>

        <div th:if="${isAuthenticated}" class="actions">
            <a href="/posts/new" class="btn btn-primary"><i class="fas fa-plus"></i> New Post</a>
        </div>

        <div th:if="${not #lists.isEmpty(allTags)}" class="tag-filter">
            <span class="tag-filter-label"><i class="fas fa-tag"></i></span>
            <a th:if="${not #lists.isEmpty(activeTags)}" href="/posts" class="tag-pill tag-pill-clear">&#x2715; Clear all</a>
            <button th:each="t : ${allTags}"
                    th:text="'#' + ${t.name}"
                    th:classappend="${activeTags.contains(t.name)} ? ' active' : ''"
                    th:data-tag="${t.name}"
                    onclick="toggleTag(this.dataset.tag)"
                    class="tag-pill tag-pill-btn"></button>
        </div>

        <div th:if="${not #lists.isEmpty(posts)}" class="posts-grid">
            <div th:each="post : ${posts}" class="post-card">
                <div class="post-content">
                    <div class="post-icon"><i class="fas fa-file-alt"></i></div>
                    <div class="post-preview">
                        <a th:href="@{/posts/{id}(id=${post.id})}" th:text="${post.content}">Post content</a>
                    </div>
                    <div class="post-meta">
                        <div class="meta-item">
                            <i class="fas fa-user"></i>
                            <span th:text="${post.authorName}">Author</span>
                        </div>
                    </div>
                    <div th:if="${not #sets.isEmpty(post.tags)}" class="post-tag-list">
                        <button th:each="tag : ${post.tags}"
                                th:text="'#' + ${tag.name}"
                                th:classappend="${activeTags.contains(tag.name)} ? ' active' : ''"
                                th:data-tag="${tag.name}"
                                onclick="toggleTag(this.dataset.tag)"
                                class="post-tag post-tag-btn"></button>
                    </div>
                    <div th:if="${isAuthenticated and (currentUsername == post.authorName or isAdmin)}" class="post-actions">
                        <a th:href="@{/posts/edit/{id}(id=${post.id})}" class="btn btn-secondary" style="padding: 8px 16px; font-size: 0.85rem;">
                            <i class="fas fa-edit"></i> Edit
                        </a>
                        <form th:action="@{/posts/delete/{id}(id=${post.id})}" method="post" style="margin:0;">
                            <button type="submit" class="btn btn-danger" style="padding: 8px 16px; font-size: 0.85rem;"
                                    onclick="return confirm('Delete this post?')">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(posts)}" class="empty-state">
            <div class="empty-icon"><i class="fas fa-newspaper"></i></div>
            <h3 class="empty-title">No Posts Yet</h3>
            <p class="empty-text">Be the first to share something!</p>
        </div>
    </div>
<script>
function toggleTag(name) {
    var url = new URL(window.location.href);
    var active = url.searchParams.getAll('tags');
    var idx = active.indexOf(name);
    if (idx >= 0) {
        active.splice(idx, 1);
    } else {
        active.push(name);
    }
    url.searchParams.delete('tags');
    active.forEach(function(t) { url.searchParams.append('tags', t); });
    window.location.href = url.pathname + (active.length ? '?' + url.searchParams.toString() : '');
}
</script>
</body>
</html>
